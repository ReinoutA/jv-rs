name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +stable test --all-targets --all-features
      - name: Documentation tests
        run: cargo +stable test --doc
      - name: API documentation
        run: cargo +stable doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package verification
        run: cargo +stable package

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Tests
        run: cargo +1.85.0 test --all-targets --all-features
      - name: Documentation tests
        run: cargo +1.85.0 test --doc

  stress:
    name: Stress with overflow and invariant checks
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Stress test
        run: cargo +stable test --release --test stress -- --ignored
